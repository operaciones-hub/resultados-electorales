<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados Electorales — Chubut</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap');
:root {
  --navy:#5592a3; --navy-light:#597b9e; --navy-dark:#c2b59b;
  --accent:#5b9bd5; --gold:#c9a84c; --bg:#d9d9d9; --white:#fff;
  --text:#0f1a30; --muted:#0f1a30; --green:#27ae60; --border:#d9d9d9;
  --warn:#e67e22; --warn-bg:#fef9e7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);padding:20px 12px}
.R{font-family:'Source Sans 3','Segoe UI',sans-serif;color:var(--text);max-width:1100px;margin:0 auto}
.R-hd{background:linear-gradient(135deg,var(--text),var(--navy),var(--navy-light));color:#fff;padding:24px 28px;border-radius:8px 8px 0 0}
.R-hd h1{font-size:22px;font-weight:700;letter-spacing:.5px;margin-bottom:2px}
.R-hd .sub{font-size:13px;font-weight:300;opacity:.8}
.R-ctl{background:var(--white);padding:14px 28px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.R-grp{display:flex;flex-direction:column;gap:3px}
.R-grp label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.R-grp select{padding:8px 12px;border:1px solid var(--border);border-radius:5px;font-family:inherit;font-size:14px;min-width:180px;cursor:pointer;background:var(--white)}
.R-grp select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(91,155,213,.2)}
.R-years{display:flex;gap:4px;flex-wrap:wrap}
.R-yr{padding:7px 14px;border:2px solid var(--navy);border-radius:5px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;background:var(--white);color:var(--navy);transition:.15s}
.R-yr:hover,.R-yr.on{background:var(--navy);color:#fff}
.R-yr.off{opacity:.3;cursor:not-allowed;border-style:dashed}
.R-modes{display:flex;gap:0;margin-left:auto}
.R-md{padding:8px 16px;border:1px solid var(--border);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;background:var(--white);color:var(--muted);transition:.15s}
.R-md:first-child{border-radius:5px 0 0 5px}.R-md:last-child{border-radius:0 5px 5px 0}
.R-md.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.R-nivel{display:flex;gap:0}
.R-nv{padding:8px 18px;border:2px solid var(--accent);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;background:var(--white);color:var(--accent);transition:.15s;letter-spacing:.3px}
.R-nv:first-child{border-radius:5px 0 0 5px}.R-nv:last-child{border-radius:0 5px 5px 0}
.R-nv.on{background:var(--accent);color:#fff}
.R-body{background:var(--white);padding:24px 28px;min-height:200px}
table.T{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:24px}
.T th{background:var(--navy);color:#fff;padding:10px 12px;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.T th.r,.T td.r{text-align:right}.T th.c,.T td.c{text-align:center}
.T td{padding:8px 12px;border-bottom:1px solid var(--border)}
.T tr:hover td{background:#f0f4f8}
.T tr.w td{background:#eef7ee;font-weight:600}
.T tr.w td:first-child{border-left:3px solid var(--green)}
.T tr.bk td{color:var(--muted);font-size:12px;background:#fafafa}
.T tr.tot td{background:var(--navy-dark);color:var(--text);font-weight:700;border:none}
.T tr.sub td{background:#e8ecf1;font-weight:600;font-size:12px}
.T tr.sec td{background:var(--navy-light);color:#fff;font-weight:700;font-size:14px;padding:12px;letter-spacing:.3px}
.T .bancas{background:var(--accent);color:#fff;border-radius:4px;padding:2px 8px;font-weight:700;font-size:12px;display:inline-block;min-width:24px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{border:1px solid var(--border);border-radius:6px;padding:14px 16px;cursor:pointer;transition:.15s;display:flex;justify-content:space-between;align-items:center}
.card:hover{border-color:var(--navy);box-shadow:0 2px 8px rgba(27,42,74,.1)}
.card .n{font-weight:700;font-size:14px;color:var(--navy);margin-bottom:2px}
.card .p{font-size:11px;color:var(--muted)}
.card .pct{font-size:20px;font-weight:700;color:var(--navy)}
.cmp-bar{background:#fffde7;border:1px solid #f9e076;border-radius:6px;padding:10px 16px;margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.chip{background:var(--navy);color:#fff;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip .x{cursor:pointer;opacity:.7;font-size:14px}.chip .x:hover{opacity:1}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .ic{font-size:48px;margin-bottom:12px}.empty .mg{font-size:16px}.empty .ht{font-size:13px;margin-top:8px}
.R-ft{background:var(--navy-dark);color:var(--text);padding:14px 28px;font-size:11px;border-radius:0 0 8px 8px}
.nav-btns{display:flex;justify-content:space-between;margin-top:8px}
.warn-box{background:var(--warn-bg);border:1px solid var(--warn);border-radius:6px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#7d6608;display:flex;align-items:flex-start;gap:10px}
.warn-box .wi{font-size:20px;flex-shrink:0}
.prov-header{background:linear-gradient(135deg,#2d4470,#3a5a8c);border-radius:8px;padding:20px 24px;color:#fff;margin-bottom:20px}
.prov-header h2{font-size:18px;font-weight:700;margin-bottom:4px}
.prov-header .meta{font-size:13px;opacity:.8;display:flex;flex-wrap:wrap;gap:16px}
.prov-header .formula{font-size:15px;font-weight:500;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.2)}
.prov-dual{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.loading{text-align:center;padding:80px 20px;color:var(--muted);font-size:16px}
.cand-photo{width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:1px solid var(--border);flex-shrink:0;cursor:pointer;transition:transform .15s}
.cand-photo:hover{transform:scale(1.2);border-color:var(--accent)}
.cand-cell{display:flex;align-items:center;gap:0}
.cand-cell strong{flex:1;min-width:0}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:lbIn .2s}
.lightbox img{max-width:90vw;max-height:85vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5);object-fit:contain}
.lightbox .lb-close{position:absolute;top:16px;right:20px;color:#fff;font-size:32px;font-weight:700;cursor:pointer;line-height:1}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
@media(max-width:800px){.prov-dual{grid-template-columns:1fr}}
@media(max-width:600px){
  .R-ctl{padding:12px 16px}.R-body{padding:16px}.R-hd{padding:16px}.R-hd h1{font-size:18px}
  .R-grp select{min-width:130px;font-size:13px}.T{font-size:12px}.T td,.T th{padding:6px 8px}.cards{grid-template-columns:1fr}
  .prov-header{padding:14px 16px}.prov-header h2{font-size:16px}
}
</style>
</head>
<body>
<div class="R" id="app">
  <div class="R-hd"><h1>RESULTADOS ELECTORALES</h1><div class="sub">Provincia del Chubut — Escrutinio Definitivo</div></div>
  <div class="loading">Cargando datos...</div>
</div>
<script>
// ═══════════════════════════════════════════════════
// CARGA DE DATOS EXTERNOS
// ═══════════════════════════════════════════════════
let PROV = {};
let DATA = {};
let BANCAS = {};
let LOC_MAP = {};
let FOTOS = {};
let LOGOS = {};

async function init() {
  try {
    const [provRes, munRes] = await Promise.all([
      fetch('datos_provinciales.json').then(r => r.json()),
      fetch('datos_municipales.json').then(r => r.json())
    ]);
    PROV = provRes;
    DATA = munRes.resultados;
    BANCAS = munRes.bancas;
    LOC_MAP = munRes.loc_map;

    // Fotos: non-blocking, si falla no pasa nada
    try {
      const fotosRes = await fetch('fotos_candidatos.json').then(r => r.json());
      FOTOS = fotosRes.fotos || {};
      LOGOS = fotosRes.logos || {};
    } catch(e) { console.log('Fotos no disponibles'); }

    render();
  } catch (e) {
    document.getElementById('app').innerHTML = `
      <div class="R-hd"><h1>RESULTADOS ELECTORALES</h1><div class="sub">Provincia del Chubut</div></div>
      <div class="R-body"><div class="empty"><div class="ic">⚠️</div>
        <div class="mg">Error al cargar datos</div>
        <div class="ht">Verificá que los archivos datos_provinciales.json y datos_municipales.json estén en la misma carpeta que este HTML.<br><br><code style="font-size:11px;color:#c0392b">${e.message}</code></div>
      </div></div>`;
  }
}

// ═══════════════════════════════════════════════════
// CONSTANTES Y ESTADO
// ═══════════════════════════════════════════════════
const CATS=["Intendente","Concejales","Jefe Comunal","Consejo de la Magistratura","Tribunal de Cuentas","Juez de Paz"];
const CLAB={"Intendente":"INTENDENTE","Concejales":"CONCEJALES","Jefe Comunal":"JEFE COMUNAL","Consejo de la Magistratura":"REP. CONSEJO DE LA MAGISTRATURA","Tribunal de Cuentas":"TRIBUNAL DE CUENTAS","Juez de Paz":"JUEZ DE PAZ"};
const YRS=[2023,2019,2015,2011,2007,2003,1999,1995,1991,1987,1983];
const MUN_AVAIL=[2023];

let S={year:2023,nivel:"provincial",mode:"detalle",loc:"",cmp:[],cat:"Intendente"};

// ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
function locsFor(y,c){const d=DATA[y];return d?Object.keys(d).filter(l=>d[l][c]).sort():[];}
function catsFor(y,l){const d=DATA[y];return(!d||!d[l])?[]:CATS.filter(c=>d[l][c]);}
function res(y,l,c){const d=DATA[y];if(!d||!d[l]||!d[l][c])return[];return d[l][c].map(r=>({p:r[0],c:r[1],v:r[2],pct:r[3],bk:r[4]}));}
function fmt(n){return n!=null?n.toLocaleString("es-AR"):"-";}

function fotoImg(loc, cat, party) {
  // Exact match first
  const key = `${loc}|${cat}|${party}`;
  let url = FOTOS[key];

  // Fuzzy match on fotos
  if (!url) {
    const norm = s => s.toUpperCase().replace(/[–—-]/g,' ').replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim();
    const pn = norm(party);
    for (const [k, v] of Object.entries(FOTOS)) {
      if (!k.startsWith(loc+'|'+cat+'|')) continue;
      const kp = norm(k.split('|')[2]);
      if (kp === pn || kp.includes(pn) || pn.includes(kp)) { url = v; break; }
    }
  }

  // Fuzzy match on logos
  if (!url) {
    const norm = s => s.toUpperCase().replace(/[–—-]/g,' ').replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim();
    const pn = norm(party);
    for (const [k, v] of Object.entries(LOGOS)) {
      const kn = norm(k);
      if (kn === pn || kn.includes(pn) || pn.includes(kn)) { url = v; break; }
    }
  }

  if (!url) return '';
  return `<img class="cand-photo" src="${url}" onerror="this.style.display='none'" loading="lazy" onclick="openLB(this.src)" title="Click para ampliar">`;
}

function openLB(src) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<span class="lb-close">✕</span><img src="${src}">`;
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
}

function getBancas(loc,party){
  const mun=LOC_MAP[loc];
  if(!mun||!BANCAS[mun])return null;
  const pNorm=party.toUpperCase().replace(/\([^)]*\)/g,"").trim();
  for(const[k,v]of Object.entries(BANCAS[mun])){
    if(k==="__total")continue;
    const kNorm=k.replace(/\([^)]*\)/g,"").trim();
    const pw=new Set(pNorm.split(/\s+/).filter(w=>w.length>3&&!["ALIANZA","PARTIDO","POR"].includes(w)));
    const kw=new Set(kNorm.split(/\s+/).filter(w=>w.length>3&&!["ALIANZA","PARTIDO","POR"].includes(w)));
    let matches=0;
    for(const w of pw){if(kw.has(w))matches++;}
    if(matches>=2||pNorm.includes(kNorm.slice(0,15))||kNorm.includes(pNorm.slice(0,15)))return v;
  }
  return 0;
}
function getTotalBancas(loc){
  const mun=LOC_MAP[loc];
  return(mun&&BANCAS[mun])?BANCAS[mun]["__total"]:null;
}

// ═══════════════════════════════════════════════════
// RENDER: TABLA PROVINCIAL
// ═══════════════════════════════════════════════════
function renderProvTable(data, label, showBancas, provCat) {
  let h = `<table class="T">`;
  h += `<tr class="sec"><td colspan="${showBancas ? 4 : 3}">${label}</td></tr>`;
  h += `<tr><th style="width:${showBancas ? '45%' : '50%'}">Partido / Alianza</th><th class="r">Votos</th><th class="c">%</th>`;
  if (showBancas) h += `<th class="c">Bancas</th>`;
  h += `</tr>`;
  const sorted = [...data.partidos].sort((a, b) => b[1] - a[1]);
  sorted.forEach((row, i) => {
    const isW = i === 0;
    const foto = fotoImg('_PROVINCIA', provCat||'', row[0]);
    h += `<tr class="${isW ? 'w' : ''}">`;
    h += `<td><div class="cand-cell">${foto}<strong>${row[0]}</strong></div></td>`;
    h += `<td class="r" style="font-weight:700">${fmt(row[1])}</td>`;
    h += `<td class="c">${row[2].toFixed(2)}%</td>`;
    if (showBancas) {
      const b = row.length > 3 ? row[3] : null;
      h += `<td class="c">${b ? '<span class="bancas">' + b + '</span>' : '-'}</td>`;
    }
    h += `</tr>`;
  });
  h += `<tr class="sub"><td>VOTOS POSITIVOS</td><td class="r">${fmt(data.positivos)}</td><td class="c">${data.total > 0 ? (data.positivos / data.total * 100).toFixed(2) : 0}%</td>${showBancas ? '<td></td>' : ''}</tr>`;
  h += `<tr class="bk"><td>VOTOS EN BLANCO</td><td class="r">${fmt(data.blanco)}</td><td class="c">${data.total > 0 ? (data.blanco / data.total * 100).toFixed(2) : 0}%</td>${showBancas ? '<td></td>' : ''}</tr>`;
  h += `<tr class="bk"><td>VOTOS ANULADOS</td><td class="r">${fmt(data.nulos)}</td><td class="c">${data.total > 0 ? (data.nulos / data.total * 100).toFixed(2) : 0}%</td>${showBancas ? '<td></td>' : ''}</tr>`;
  h += `<tr class="tot"><td>TOTAL VOTANTES</td><td class="r">${fmt(data.total)}</td><td class="c">100%</td>${showBancas ? '<td></td>' : ''}</tr>`;
  h += `</table>`;
  return h;
}

// ═══════════════════════════════════════════════════
// RENDER: TABLA MUNICIPAL
// ═══════════════════════════════════════════════════
function renderTable(loc,cat,showHeader){
  const r=res(S.year,loc,cat);
  if(!r.length)return"";
  const afirm=r.filter(x=>!x.bk).sort((a,b)=>b.v-a.v);
  const blanks=r.filter(x=>x.bk);
  const totAfirm=afirm.reduce((s,x)=>s+(x.v||0),0);
  const totAll=r.reduce((s,x)=>s+(x.v||0),0);
  const isConc=cat==="Concejales";
  const tBancas=isConc?getTotalBancas(loc):null;
  let h=`<table class="T">`;
  if(showHeader)h+=`<tr class="sec"><td colspan="${isConc?5:4}">${CLAB[cat]||cat} — ${loc.toUpperCase()}${tBancas?" ("+tBancas+" bancas)":""}</td></tr>`;
  h+=`<tr><th style="width:${isConc?"40%":"50%"}">Partido / Alianza</th><th class="r">Votos</th><th class="c">%</th>`;
  if(isConc)h+=`<th class="c">Bancas</th>`;
  h+=`</tr>`;
  afirm.forEach((x,i)=>{
    const w=i===0;
    const b=isConc?getBancas(loc,x.p):null;
    const foto=fotoImg(loc,cat,x.p);
    h+=`<tr class="${w?"w":""}"><td><div class="cand-cell">${foto}<strong>${x.p}</strong></div>${x.c?'<span style="font-size:11px;color:var(--muted);margin-left:34px">'+x.c+"</span>":""}</td>`;
    h+=`<td class="r" style="font-weight:700">${fmt(x.v)}</td>`;
    h+=`<td class="c">${x.pct.toFixed(2)}%</td>`;
    if(isConc)h+=`<td class="c">${b?'<span class="bancas">'+b+"</span>":"-"}</td>`;
    h+=`</tr>`;
  });
  h+=`<tr class="sub"><td>VOTOS POSITIVOS</td><td class="r">${fmt(totAfirm)}</td><td class="c">${totAll>0?(totAfirm/totAll*100).toFixed(2):0}%</td>${isConc?"<td></td>":""}</tr>`;
  blanks.forEach(x=>{
    h+=`<tr class="bk"><td>${x.p.toUpperCase()}</td><td class="r">${fmt(x.v)}</td><td class="c">${x.pct.toFixed(2)}%</td>${isConc?"<td></td>":""}</tr>`;
  });
  h+=`<tr class="tot"><td>TOTAL VOTANTES</td><td class="r">${fmt(totAll)}</td><td class="c">100%</td>${isConc?"<td></td>":""}</tr>`;
  h+=`</table>`;
  return h;
}

// ═══════════════════════════════════════════════════
// RENDER PRINCIPAL
// ═══════════════════════════════════════════════════
function render(){
  const app=document.getElementById("app");
  const isProv = S.nivel === "provincial";
  const isMun = S.nivel === "municipal";
  const yearAvail = isProv ? YRS : MUN_AVAIL;
  if (!yearAvail.includes(S.year)) S.year = yearAvail[0];
  const lfc = isMun ? locsFor(S.year, S.cat) : [];

  let h = `
  <div class="R-hd">
    <h1>RESULTADOS ELECTORALES</h1>
    <div class="sub">Provincia del Chubut — Escrutinio Definitivo</div>
  </div>
  <div class="R-ctl">
    <div class="R-grp"><label>Nivel</label>
      <div class="R-nivel">
        <button class="R-nv ${isProv?'on':''}" onclick="SS({nivel:'provincial',mode:'detalle',loc:'',cmp:[]})">Provincial</button>
        <button class="R-nv ${isMun?'on':''}" onclick="SS({nivel:'municipal',mode:'detalle',loc:'',cmp:[]})">Municipal</button>
      </div>
    </div>
    <div class="R-grp"><label>Año electoral</label><div class="R-years">${YRS.map(y=>{
      const a=yearAvail.includes(y);
      return`<button class="R-yr ${y===S.year?"on":""} ${a?"":"off"}" onclick="${a?`SS({year:${y},loc:'',cmp:[]})`:""}">${y}</button>`;
    }).join("")}</div></div>
  </div>`;

  if (isProv) {
    const pData = PROV[S.year];
    h += `<div class="R-body">`;
    if (pData) {
      h += `<div class="prov-header">`;
      h += `<h2>Elecciones Provinciales ${S.year}</h2>`;
      h += `<div class="meta"><span>📅 ${pData.fecha}</span><span>📋 Electores: ${fmt(pData.electores)}</span><span>🗳️ Participación: ${pData.participacion.toFixed(2)}%</span></div>`;
      h += `<div class="formula">Fórmula electa: <strong>${pData.formula}</strong></div></div>`;
      if (pData.advertencia) h += `<div class="warn-box"><span class="wi">⚠️</span><span>${pData.advertencia}</span></div>`;
      h += `<div class="prov-dual">`;
      h += `<div>${renderProvTable(pData.gobernador, "GOBERNADOR Y VICEGOBERNADOR", false, "Gobernador")}</div>`;
      h += `<div>${renderProvTable(pData.diputados, "DIPUTADOS PROVINCIALES (" + (pData.diputados.bancas || 27) + " bancas)", true, "Diputados")}</div>`;
      h += `</div>`;
    } else {
      h += `<div class="empty"><div class="ic">📊</div><div class="mg">Datos provinciales no disponibles para ${S.year}</div></div>`;
    }
    h += `</div>`;
  } else {
    h += `<div class="R-ctl" style="padding-top:8px;border-bottom:none">
    <div class="R-grp"><label>Categoría</label>
      <select onchange="SS({cat:this.value,loc:'',cmp:[]})">
        ${CATS.filter(c=>locsFor(S.year,c).length>0).map(c=>`<option value="${c}"${c===S.cat?" selected":""}>${CLAB[c]} (${locsFor(S.year,c).length})</option>`).join("")}
      </select>
    </div>
    <div class="R-grp"><label>Localidad</label>
      <select onchange="SS({loc:this.value,mode:'detalle'})">
        <option value="">— Todas —</option>
        ${lfc.map(l=>`<option value="${l}"${l===S.loc?" selected":""}>${l}</option>`).join("")}
      </select>
    </div>
    <div class="R-modes">
      <button class="R-md ${S.mode==="ganadores"?"on":""}" onclick="SS({mode:'ganadores',loc:''})">Ganadores</button>
      <button class="R-md ${S.mode==="detalle"?"on":""}" onclick="SS({mode:'detalle'})">Detalle</button>
      <button class="R-md ${S.mode==="comparar"?"on":""}" onclick="SS({mode:'comparar',loc:''})">Comparar</button>
    </div>
  </div>
  <div class="R-body">`;

    if(S.mode==="ganadores"){
      const ws=lfc.map(l=>{const r=res(S.year,l,S.cat).filter(x=>!x.bk).sort((a,b)=>b.v-a.v);return r.length?{l,...r[0]}:null;}).filter(Boolean);
      h+=`<div class="cards">${ws.map(w=>`<div class="card" onclick="SS({loc:'${w.l}',mode:'detalle'})"><div><div class="n">${w.l}</div><div class="p">${w.p}</div></div><div class="pct">${w.pct.toFixed(1)}%</div></div>`).join("")}</div>`;
    } else if(S.mode==="detalle"){
      if(!S.loc){
        h+=`<div class="empty"><div class="ic">🗳️</div><div class="mg">Seleccioná una localidad</div><div class="ht">O elegí "Ganadores" para un resumen</div></div>`;
      } else {
        h+=renderTable(S.loc,S.cat,true);
        const idx=lfc.indexOf(S.loc);
        h+=`<div class="nav-btns">`;
        h+=idx>0?`<button class="R-yr" onclick="SS({loc:'${lfc[idx-1]}'})">◄ ${lfc[idx-1]}</button>`:`<div></div>`;
        h+=idx<lfc.length-1?`<button class="R-yr" onclick="SS({loc:'${lfc[idx+1]}'})">  ${lfc[idx+1]} ►</button>`:"";
        h+=`</div>`;
      }
    } else if(S.mode==="comparar"){
      h+=`<div style="margin-bottom:16px"><label style="font-size:12px;font-weight:600;color:var(--muted)">Agregar localidades:</label>
        <select onchange="addCmp(this.value);this.value=''" style="margin-left:8px;padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-size:13px">
          <option value="">+ Agregar</option>${lfc.filter(l=>!S.cmp.includes(l)).map(l=>`<option value="${l}">${l}</option>`).join("")}
        </select></div>`;
      if(S.cmp.length>0){
        h+=`<div class="cmp-bar">Comparando: ${S.cmp.map(l=>`<span class="chip">${l} <span class="x" onclick="rmCmp('${l}')">✕</span></span>`).join("")}</div>`;
        const allP=new Set();const blankTypes=new Set();
        S.cmp.forEach(l=>{const r=res(S.year,l,S.cat);r.forEach(x=>{if(x.bk)blankTypes.add(x.p);else allP.add(x.p);});});
        const parties=[...allP].sort();const blanks=[...blankTypes].sort();const isConc=S.cat==="Concejales";
        h+=`<table class="T"><tr><th>Partido / Alianza</th>`;
        S.cmp.forEach(l=>{h+=`<th class="c" colspan="${isConc?3:2}">${l.toUpperCase()}</th>`;});
        h+=`</tr><tr><th></th>`;
        S.cmp.forEach(()=>{h+=`<th class="r" style="font-size:10px">Votos</th><th class="c" style="font-size:10px">%</th>`;if(isConc)h+=`<th class="c" style="font-size:10px">Bancas</th>`;});
        h+=`</tr>`;
        parties.forEach(p=>{
          h+=`<tr><td><strong>${p}</strong></td>`;
          S.cmp.forEach(l=>{
            const r=res(S.year,l,S.cat);const m=r.find(x=>x.p===p);
            const isW=r.filter(x=>!x.bk).sort((a,b)=>b.v-a.v)[0]?.p===p;
            const st=isW?'font-weight:700;color:var(--green)':"";
            if(m){h+=`<td class="r" style="${st}">${fmt(m.v)}</td><td class="c" style="${st}">${m.pct.toFixed(1)}%</td>`;if(isConc){const b=getBancas(l,p);h+=`<td class="c">${b?'<span class="bancas">'+b+"</span>":"-"}</td>`;}}
            else{h+=`<td class="r" style="color:var(--muted)">—</td><td class="c">—</td>`;if(isConc)h+=`<td class="c">—</td>`;}
          });h+=`</tr>`;
        });
        h+=`<tr class="sub"><td>VOTOS POSITIVOS</td>`;
        S.cmp.forEach(l=>{const r=res(S.year,l,S.cat);const t=r.filter(x=>!x.bk).reduce((s,x)=>s+(x.v||0),0);const tot=r.reduce((s,x)=>s+(x.v||0),0);h+=`<td class="r">${fmt(t)}</td><td class="c">${tot>0?(t/tot*100).toFixed(1)+"%":""}</td>`;if(isConc)h+=`<td></td>`;});
        h+=`</tr>`;
        blanks.forEach(bp=>{h+=`<tr class="bk"><td>${bp.toUpperCase()}</td>`;S.cmp.forEach(l=>{const r=res(S.year,l,S.cat);const m=r.find(x=>x.p===bp);h+=`<td class="r">${m?fmt(m.v):"-"}</td><td class="c">${m?m.pct.toFixed(1)+"%":"-"}</td>`;if(isConc)h+=`<td></td>`;});h+=`</tr>`;});
        h+=`<tr class="tot"><td>TOTAL VOTANTES</td>`;
        S.cmp.forEach(l=>{const r=res(S.year,l,S.cat);const tot=r.reduce((s,x)=>s+(x.v||0),0);h+=`<td class="r">${fmt(tot)}</td><td class="c">100%</td>`;if(isConc)h+=`<td></td>`;});
        h+=`</tr></table>`;
      } else {
        h+=`<div class="empty"><div class="ic">📊</div><div class="mg">Seleccioná 2 o más localidades para comparar</div></div>`;
      }
    }
    h+=`</div>`;
  }

  h+=`<div class="R-ft">Fuente: datosoficiales.juschubut.gov.ar — Escrutinio Definitivo · Recopilación histórica: Secretaría Electoral Permanente del Chubut</div>`;
  app.innerHTML=h;
}

function SS(p){Object.assign(S,p);render();}
function addCmp(l){if(l&&!S.cmp.includes(l)){S.cmp=[...S.cmp,l];render();}}
function rmCmp(l){S.cmp=S.cmp.filter(x=>x!==l);render();}

// Arrancar
init();
</script>
</body>
</html>
